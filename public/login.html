<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Helpdesk Dimensional</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="d-flex align-items-center justify-content-center">
    <div id="liveAlertPlaceholder" class="alert-toast-container"></div>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4 mt-5">
          <div class="layer-2 p-4 pt-0 text-center">
            <div class="overlap-header justify-content-center">
              <h4 class="m-0 fw-bold">Acesso ao Helpdesk</h4>
            </div>

            <form class="text-start mt-4">
              <div class="mb-4">
                <label class="form-label">E-mail Corporativo</label>
                <input
                  type="email"
                  class="form-control"
                  placeholder="seu@email.com"
                  id="email"
                  name="email"
                  required
                />
              </div>
              <div class="mb-5">
                <label class="form-label">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="••••••••"
                  required
                  id="senha"
                  name="senha"
                />
              </div>
              <button
                type="submit"
                class="btn btn-indigo w-100 py-2"
                id="btnLogin"
              >
                Entrar no Sistema
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
